# Supply-chain gate: advisories, licences, bans and sources.
# Run with `make deny` / `cargo deny check`. The engine has no dependencies
# today (ADR-0001); this keeps it that way on purpose rather than by accident.

[graph]
targets = [
    "wasm32-unknown-unknown",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
# rustls 0.23.46 fixes these four; sluis holds new versions for 3 days, so it
# is ours from 2026-10-17 09:54 UTC (#565). None reaches us meanwhile.
ignore = [
    { id = "RUSTSEC-2026-0346", reason = "no TLS or reqwest value is Debug-formatted; rustls 0.23.46 held by sluis delay until 2026-10-17 (#565)" },
    { id = "RUSTSEC-2026-0347", reason = "ECH not used; rustls 0.23.46 held by sluis delay until 2026-10-17 (#565)" },
    { id = "RUSTSEC-2026-0348", reason = "brotli feature off; rustls 0.23.46 held by sluis delay until 2026-10-17 (#565)" },
    { id = "RUSTSEC-2026-0349", reason = "ring provider, no post-quantum key exchange to downgrade; rustls 0.23.46 held by sluis delay until 2026-10-17 (#565)" },
]

[licenses]
# ISC, BSD-3-Clause and CDLA-Permissive-2.0 come with TLS for the assist
# server (ADR-0028): ring, rustls-webpki, untrusted, subtle, webpki-roots.
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "ISC", "BSD-3-Clause", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency inside the workspace (algo-assist on algo-dsp) has no
# version; both crates are unpublished, so it is not a wildcard on a registry.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
