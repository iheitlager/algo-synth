[workspace]
members = ["crates/dsp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/iheitlager/algo-synth"
rust-version = "1.85"

[workspace.lints.rust]
# Only crates/dsp/src/ffi.rs may use `unsafe` (the `no_mangle` exports, ADR-0001).
unsafe_code = "deny"

[workspace.lints.clippy]
# Rust 2018 module style: `name.rs` next to `name/`, never `mod.rs`.
mod_module_files = "deny"
# The audio thread never panics (ADR-0002): a panic in wasm kills the worklet.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"

# ADR-0002: small, fast and abort-on-panic, no unwinding tables in the wasm.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
